<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>To-Do List Pro</title>
    <link rel="stylesheet" href="tugas tdl.css">
</head>
<body>
    <div class="container">
        <h2>To-Do List Pro</h2>
        
        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Cari tugas...">
        </div>

        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Tulis tugas baru...">
            <select id="priorityInput">
                <option value="Penting">Penting 🟥</option>
                <option value="Sedang" selected>Sedang 🟨</option>
                <option value="Santai">Santai 🟩</option>
            </select>
            <select id="tagInput">
                <option value="Sekolah">Sekolah 📚</option>
                <option value="Pribadi">Pribadi 🏠</option>
                <option value="Lainnya">Lainnya 📌</option>
            </select>
            <button id="addTaskBtn">Tambah</button>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">Semua</button>
            <button class="filter-btn" data-filter="active">Belum</button>
            <button class="filter-btn" data-filter="completed">Selesai</button>
        </div>

        <ul id="taskList"></ul>
    </div>

    <script src="tugastdl.js"></script>
</body>
</html>
